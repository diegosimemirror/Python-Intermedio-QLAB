# Publica el sitio de la tarea 4 (tarea_4/sitio/) en GitHub Pages cada vez que cambia en main.
# Requisito, una sola vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Dirección: https://diegosimemirror.github.io/Python-Intermedio-QLAB/tarea_4/
name: Sitio de la tarea 4

on:
  push:
    branches: [main]
    paths:
      - "tarea_4/sitio/**"
      - ".github/workflows/sitio-tarea4.yml"
  workflow_dispatch:        # permite publicarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}tarea_4/
    steps:
      - uses: actions/checkout@v4

      # El sitio queda en /tarea_4/ y la raíz redirige ahí (deja espacio para publicar otras tareas).
      - name: Armar la carpeta del sitio
        run: |
          mkdir -p _site
          cp -r tarea_4/sitio _site/tarea_4
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><title>Python Intermedio · QLAB</title>
          <meta http-equiv="refresh" content="0; url=tarea_4/"></head>
          <body><p><a href="tarea_4/">Tarea 4: agente de investigación socioeconómica</a></p></body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
