<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe final · Tarea 4</title>
<meta name="description" content="Informe completo del agente de investigación socioeconómica: precios del BCRP, poder de compra de Juntos y pobreza monetaria con la ENAHO 2024.">
<link rel="stylesheet" href="estilo.css">
<script>try { var t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="barra">
  <div class="envoltura">
    <a class="marca" href="index.html">Tarea 4 <span>· Agente socioeconómico</span></a>
    <nav class="menu" aria-label="Secciones">
      <a href="index.html">Resumen</a>
      <a href="informe.html" aria-current="page">Informe completo</a>
      <a class="opcional" href="https://github.com/diegosimemirror/Python-Intermedio-QLAB/tree/main/tarea_4">Código</a>
    </nav>
    <button class="tema" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">◐</button>
  </div>
</header>
<main class="envoltura informe">
  <aside class="indice" aria-label="Índice del informe">
    <p><a href="index.html">← Volver al resumen</a></p>
    {{indice}}
  </aside>
  <article class="articulo">
    {{cuerpo}}
    <p class="nota">Página generada el {{fecha}} desde <code>informes/informe_final.md</code> con
    <code>scripts/construir_sitio.py</code>. El texto es el del informe, sin cambios.</p>
  </article>
</main>
<script>
document.querySelector(".tema").addEventListener("click", function () {
  var raiz = document.documentElement;
  var oscuro = raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  raiz.dataset.theme = oscuro ? "light" : "dark";
  try { localStorage.setItem("tema", raiz.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
