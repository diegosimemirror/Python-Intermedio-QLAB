[project]
name = "tarea4-agente-socioeconomico"
version = "0.1.0"
description = "Agente de investigación socioeconómica: MCP del BCRP + Skills de la ENAHO 2024"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",   # servidor MCP
    "httpx",           # llamadas a la API del BCRP
    "pandas",          # tablas y lectura de Stata
    "pyarrow",         # guardar la base limpia en parquet
    "geopandas",       # mapa departamental
    "matplotlib",      # gráficos y mapa
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
